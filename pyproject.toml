[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "classification_module"
version = "0.0.1"
description = "Проект для домашнего задания №1"
authors = [{ name = "Yaroslav" }]
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]
requires-python = "~=3.11.0"
dependencies = [
    "ipython>=9.7.0",
    "jupyterlab>=4.5.0",
    "matplotlib>=3.10.7",
    "mlflow>=3.7.0",
    "notebook>=7.5.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
]

# ============ Ruff Configuration ============
[tool.ruff]
# Максимальная длина строки
line-length = 99

# Где искать исходный код (для импортов и путей)
src = ["classification_module"]

# Явно указываем, какие файлы обрабатывать (опционально, но безопасно)
include = ["classification_module/**/*.py"]

# Исключаем всё, что не в src (защита от случайного форматирования .gitignore и т.п.)
exclude = [
    ".git",
    ".venv",
    ".idea",
    ".vscode",
    "__pycache__",
    "*.ipynb",
    "notebooks/",
    "data/",
    "models/",
    "reports/",
    "docs/",
    "tests/",  # если появятся
]

[tool.ruff.lint]
# Включаем базовые правила + сортировку импортов
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # длина строки — не линтерская ошибка, а форматтерская

# Агрессивное исправление при --fix
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["classification_module"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
